worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile   on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    server_tokens off;

    log_format main '$remote_addr - $request "$request_uri" $status $body_bytes_sent';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # Rendered from templates/default.conf.template by the image's
    # built-in envsubst-on-templates entrypoint script.
    include /etc/nginx/conf.d/*.conf;
}
